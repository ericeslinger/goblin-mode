name = "goblin-mode"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
send_metrics = false

# The custom domain comes from APP_DOMAIN: scripts/deploy.sh passes it
# with --domain, so no deployment's domain is committed here.

[assets]
directory = "../../packages/frontend/dist/frontend/browser"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only the proxied server routes reach the script; see src/index.ts.
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/.well-known/*", "/oauth/register", "/oauth/token", "/oauth/approve"]

# FUNCTIONS_ORIGIN is passed by scripts/deploy.sh with --var, from
# FIREBASE_PROJECT_ID.
