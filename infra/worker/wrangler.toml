name = "goblin-mode"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
send_metrics = false

routes = [{ pattern = "mossgoblin.garden", custom_domain = true }]

[assets]
directory = "../../packages/frontend/dist/frontend/browser"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only the proxied server routes reach the script; see src/index.ts.
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/.well-known/*", "/oauth/register", "/oauth/token", "/oauth/approve"]

[vars]
# scripts/deploy.sh also passes this with --var, from FIREBASE_PROJECT_ID.
FUNCTIONS_ORIGIN = "https://us-central1-mossgoblin-garden.cloudfunctions.net"
