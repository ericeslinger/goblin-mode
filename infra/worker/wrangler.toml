name = "mossgoblin"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
send_metrics = false

# The custom domain comes from APP_DOMAIN: scripts/deploy.sh passes it
# with --domain, so no deployment's domain is committed here.

[assets]
directory = "../../packages/frontend/dist/frontend/browser"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only the proxied server routes reach the script; see src/index.ts.
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/.well-known/*", "/oauth/register", "/oauth/token", "/oauth/approve", "/oauth/revoke", "/share"]

# FUNCTIONS_ORIGIN, FIREBASE_PROJECT_ID and OWNER_UID (the episode
# proxy's token check, #180) are passed by scripts/deploy.sh with
# --var, from the variables of those names. So are APP_DOMAIN, the
# audience the functions' identity tokens must name, and
# NOTE_KEY_CALLERS, the service accounts allowed to ask the note key
# service for a gardener's key (src/note-key.ts, 2026-11-13); neither
# is confidential.

# NOTE_KEYS_MASTER (the note key service's master) is a Worker secret,
# set once by hand with `wrangler secret put` (README, Run your own),
# never through the deploy. The functions hold no secret for it: they
# present a Google-signed identity token instead (2026-11-13).
